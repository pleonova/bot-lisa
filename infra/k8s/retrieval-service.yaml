# Scaffold only -- not applied/tested here (no cluster in this environment).
# Try it locally first with k3d or minikube:
#   k3d cluster create bot-lisa
#   docker build -t bot-lisa:local -f infra/Dockerfile .
#   k3d image import bot-lisa:local -c bot-lisa
#   kubectl apply -f infra/k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  labels:
    app: retrieval-service
spec:
  replicas: 1
  # Recreate instead of the default RollingUpdate: a rolling update briefly
  # needs both the old and new pod's memory reserved at once, and this
  # node (s-1vcpu-2gb) doesn't have room for two copies of this service at
  # its real memory footprint alongside orchestration-service and
  # ingestion-service. Costs a few seconds of downtime per deploy instead --
  # a fine tradeoff for a personal project, not worth it for something with
  # real concurrent users.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: retrieval-service
  template:
    metadata:
      labels:
        app: retrieval-service
    spec:
      containers:
        - name: retrieval-service
          image: registry.digitalocean.com/bot-lisa/bot-lisa:latest
          command: ["uvicorn", "services.retrieval_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "896Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
spec:
  selector:
    app: retrieval-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
