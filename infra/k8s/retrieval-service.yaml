# Live and applied against the bot-lisa-cluster DOKS cluster (see
# infra/terraform/main.tf) -- this is not a scaffold. Deploy changes with
# `kubectl apply -f infra/k8s/retrieval-service.yaml`, see
# android/PHONE_DEPLOY.md for the full build/push/deploy runbook.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retrieval-service-model-cache
spec:
  accessModes:
    - ReadWriteOnce
  # DOKS's default dynamically-provisioned StorageClass, backed by a real
  # DigitalOcean Block Storage volume -- billed separately from the
  # registry/image storage this is meant to avoid growing, roughly
  # $0.10/GB/month. 1Gi is generous headroom over the ~220MB model.
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  labels:
    app: retrieval-service
spec:
  replicas: 1
  # Recreate instead of the default RollingUpdate: a rolling update briefly
  # needs both the old and new pod's memory reserved at once, and this
  # node (s-1vcpu-2gb) doesn't have room for two copies of this service at
  # its real memory footprint alongside orchestration-service and
  # ingestion-service. Costs a few seconds of downtime per deploy instead --
  # a fine tradeoff for a personal project, not worth it for something with
  # real concurrent users.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: retrieval-service
  template:
    metadata:
      labels:
        app: retrieval-service
    spec:
      containers:
        - name: retrieval-service
          image: registry.digitalocean.com/bot-lisa/bot-lisa:latest
          command: ["uvicorn", "services.retrieval_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          # Persists the downloaded embedding model (see
          # ENV FASTEMBED_CACHE_PATH in infra/Dockerfile -- must match this
          # mountPath exactly) across restarts/deploys/reschedules, so it's
          # only ever downloaded once per volume instead of on every fresh
          # pod. Keeps the image itself from growing -- see the PVC above
          # and the "Aha" in android/PHONE_DEPLOY.md about the registry
          # quota this was hitting when the model was baked into the image
          # instead.
          volumeMounts:
            - name: model-cache
              mountPath: /opt/fastembed_cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "896Mi"
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: retrieval-service-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
spec:
  selector:
    app: retrieval-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
